name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js (If web/Capacitor based)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies and Build Web Assets
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
            if npx cap --version >/dev/null 2>&1; then
              npx cap sync android || echo "Capacitor sync skipped"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradlew and Permissions
        run: |
          # Android directory detect karein
          if [ -d "android" ]; then
            PROJECT_DIR="android"
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd $PROJECT_DIR

          # Agar gradlew nahi hai toh naya wrapper generate karein
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'
