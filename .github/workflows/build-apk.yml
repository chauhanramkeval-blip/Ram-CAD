name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web Assets (If needed)
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
            if npx cap --version >/dev/null 2>&1; then
              npx cap sync android || true
            fi
          fi

      - name: Accept Licenses & Set SDK
        run: |
          yes | sdkmanager --licenses || true
          if [ -d "android" ]; then
            TARGET_DIR="android"
          else
            TARGET_DIR="."
          fi
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > $TARGET_DIR/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradlew
        run: |
          cd ${{ env.TARGET_DIR }}
          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create Missing Keystore and Configs
        run: |
          # 1. Generate default debug keystore jahan Gradle dhoondh raha hai
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Agar project root ya app folder me chahiye to copy karein
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          cp debug.keystore ${{ env.TARGET_DIR }}/debug.keystore 2>/dev/null || true

          # 2. Agar google-services.json missing hai to dummy create karein taaki build na ruke
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"dummy-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.example.app"}},"api_key":[{"current_key":"dummy_key"}]}]}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.TARGET_DIR }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'
