      name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

      name: Ensure Gradle Wrapper Exists
      run: |
        # Check karein gradlew root me hai ya android folder me
        TARGET_DIR="."
        if [ -d "android" ]; then
          TARGET_DIR="android"
        fi
        
        cd $TARGET_DIR
        
        # Agar gradlew nahi hai toh naya wrapper generate karein
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Generating gradle wrapper..."
          gradle wrapper
        fi
        
        chmod +x gradlew

      name: Build Debug APK
      run: |
        TARGET_DIR="."
        if [ -d "android" ]; then
          TARGET_DIR="android"
        fi
        
        cd $TARGET_DIR
        ./gradlew assembleDebug --no-daemon --stacktrace

  name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
